name: Update profile activity and contributions

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-activity.yml'
      - '.github/scripts/update_activity.py'
      - '.github/scripts/test_update_activity.py'

permissions:
  contents: read

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test profile generator
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Refresh public activity and contributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_activity.py
      - name: Publish changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: refresh public activity and contributions'
          git pull --rebase origin main
          git push origin HEAD:main
