name: Update profile activity

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-activity.yml'
      - '.github/scripts/update_activity.py'

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refresh public activity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_activity.py
      - name: Publish changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: refresh recent public activity'
          git pull --rebase origin main
          git push origin HEAD:main
